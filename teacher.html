<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendX - Live Teacher Dashboard</title>
    <!-- Libraries via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --threat-red: #ef4444;
            --present-green: #22c55e;
            --border-color: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Login View --- */
        #login-view {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .login-card h1 {
            text-align: center;
            margin-bottom: 8px;
            color: var(--accent-blue);
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .login-card p {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: var(--bg-color);
            color: var(--text-main);
            outline: none;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-blue);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: var(--accent-blue);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .btn-danger {
            background: var(--threat-red);
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .error-msg {
            color: var(--threat-red);
            font-size: 0.85rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        /* --- Dashboard View --- */
        #dashboard-view {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--card-bg);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .user-info {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
            padding: 24px 32px;
            flex: 1;
        }

        @media (max-width: 1024px) {
            .dashboard-container {
                grid-template-columns: 1fr;
            }
        }

        .main-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .control-bar {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            gap: 16px;
            align-items: flex-end;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .control-bar .form-group {
            margin-bottom: 0;
            flex: 1;
        }

        .qr-display-area {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 420px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-placeholder {
            color: #64748b;
            font-size: 0.9rem;
            text-align: center;
        }

        .timer-container {
            margin-top: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .timer-label {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .timer-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-blue);
            min-width: 30px;
        }

        /* --- Sidebar Right --- */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .panel-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
        }

        .attendance-card {
            flex: 3;
            max-height: 450px;
        }

        .threats-card {
            flex: 2;
            max-height: 300px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .card-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .count-badge {
            background: var(--present-green);
            color: #000;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85rem;
        }

        .scroll-list {
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        .scroll-list::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        .student-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--present-green);
            animation: fadeIn 0.3s ease-in-out;
        }

        .student-name {
            font-weight: 500;
            font-size: 0.95rem;
        }

        .credibility-score {
            font-size: 0.8rem;
            background: rgba(34, 197, 94, 0.15);
            color: var(--present-green);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .threat-item {
            background: rgba(239, 68, 68, 0.1);
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid var(--threat-red);
            animation: fadeIn 0.3s ease-in-out;
        }

        .threat-title {
            color: var(--threat-red);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .threat-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .empty-state {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
            margin: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- LOGIN VIEW -->
    <div id="login-view">
        <div class="login-card">
            <h1>AttendX</h1>
            <p>Teacher Attendance Portal</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="teacher@attendx.edu">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" id="login-btn">Sign In</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div id="dashboard-view">
        <header>
            <div class="logo">AttendX</div>
            <div class="user-info" id="teacher-display">Welcome, Teacher</div>
        </header>

        <div class="dashboard-container">
            <!-- Left Side: Controls & QR -->
            <div class="main-panel">
                <div class="control-bar">
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject">
                            <option value="CS101">CS101 - Computer Science</option>
                            <option value="MATH201">MATH201 - Linear Algebra</option>
                            <option value="PHY102">PHY102 - Physics II</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="class-id">Class / Section</label>
                        <select id="class-id">
                            <option value="SEC-A">Section A</option>
                            <option value="SEC-B">Section B</option>
                            <option value="SEC-C">Section C</option>
                        </select>
                    </div>
                    <button class="btn" id="btn-start" onclick="startSession()" style="width: auto; padding: 12px 24px;">Start Session</button>
                    <button class="btn btn-danger" id="btn-end" onclick="endSession()" style="width: auto; padding: 12px 24px; display: none;">End Session</button>
                </div>

                <div class="qr-display-area">
                    <div class="qr-wrapper">
                        <div id="qrcode" class="qr-placeholder">Start a session to generate dynamic QR code</div>
                    </div>
                    <div class="timer-container" id="timer-box" style="visibility: hidden;">
                        <span class="timer-label">Refreshing QR in:</span>
                        <span class="timer-value" id="timer-count">15</span>
                        <span class="timer-label">s</span>
                    </div>
                </div>
            </div>

            <!-- Right Side: Lists -->
            <div class="side-panel">
                <!-- Live Attendance List -->
                <div class="panel-card attendance-card">
                    <div class="card-header">
                        <h2>Live Attendance</h2>
                        <span class="count-badge" id="total-count">0</span>
                    </div>
                    <div class="scroll-list" id="attendance-list">
                        <div class="empty-state" id="attendance-empty">No students marked present yet</div>
                    </div>
                </div>

                <!-- Threat Alerts -->
                <div class="panel-card threats-card">
                    <div class="card-header">
                        <h2 style="color: var(--threat-red);">Threat Alerts</h2>
                    </div>
                    <div class="scroll-list" id="threats-list">
                        <div class="empty-state" id="threats-empty">No security alerts detected</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // AttendX backend URL
        const BACKEND_URL =
            (window.location.hostname === 'localhost' ||
             window.location.hostname === '127.0.0.1')
                ? 'http://localhost:3000'
                : 'https://YOUR-RENDER-URL.onrender.com';

        let socket = null;
        let qrcodeObj = null;
        let timerInterval = null;
        let countdown = 15;
        let currentSessionId = null;
        let teacherData = null;
        let presentCount = 0;

        // Initialize Socket.io Connection
        function initSocket() {
            if (socket) return;

            socket = io(BACKEND_URL);

            socket.on('connect', () => {
                console.log('Connected to WebSocket server:', socket.id);
            });

            socket.on('connect_error', (err) => {
                console.error('Socket connection error:', err.message);
            });

            // Listen: Rotating Token
            socket.on('new-token', (data) => {
                // Ignore tokens when there is no active local session.
                if (!currentSessionId) return;

                const token = typeof data === 'string' ? data : data?.token;
                if (!token) return;

                renderQRCode(JSON.stringify({ token }));
                resetCountdown();
            });

            // Listen: Student Marked
            socket.on('student-marked', (data) => {
                addStudentToList(
                    data.studentName || data.name || 'Student',
                    data.pointsDelta
                );
            });

            // Listen: Threat Alerts
            socket.on('threat-alert', (data) => {
                addThreatAlert(
                    data.studentName || data.name || data.studentId || 'Unknown Student',
                    data.reason || 'Multiple scans detected from 1 device'
                );
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from WebSocket server');
            });
        }

        // Login Form Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            errorEl.style.display = 'none';
            btn.disabled = true;
            btn.innerText = 'Signing in...';

            try {
                console.log('Sending login request to:', `${BACKEND_URL}/api/login`);

                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        password,
                        role: 'teacher'
                    })
                });

                const data = await response.json();
                console.log('Login response:', data);

                if (response.ok && data.success === true) {
                    teacherData = {
                        id: data.userId,
                        name: data.name,
                        role: data.role
                    };

                    document.getElementById('teacher-display').innerText =
                        `Teacher: ${teacherData.name}`;

                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('dashboard-view').style.display = 'flex';

                    initSocket();
                } else {
                    showError(data.message || 'Invalid credentials');
                }
            } catch (err) {
                console.error('Login request failed:', err);
                showError('Server connection failed. Make sure node server.js is running.');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Sign In';
            }
        });

        function showError(msg) {
            const errorEl = document.getElementById('login-error');
            errorEl.innerText = msg;
            errorEl.style.display = 'block';
        }

        // Start Session API Call
        async function startSession() {
            const subject = document.getElementById('subject').value;
            const classId = document.getElementById('class-id').value;

            if (!teacherData?.id) {
                alert('Teacher is not logged in.');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/session/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        teacherId: teacherData.id,
                        subject,
                        classId
                    })
                });

                const data = await response.json();
                console.log('Session start response:', data);

                if (response.ok && data.success === true) {
                    currentSessionId = data.sessionId;
                    toggleSessionState(true);
                    clearQR();
                    startTimer();
                } else {
                    alert('Failed to start session: ' + (data.message || 'Unknown error'));
                }
            } catch (err) {
                console.error('Session start failed:', err);
                alert('Server connection failed. Make sure node server.js is running.');
            }
        }

        // End Session API Call
        async function endSession() {
            if (!currentSessionId) return;

            const sessionIdToEnd = currentSessionId;

            try {
                const response = await fetch(`${BACKEND_URL}/api/session/end`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId: sessionIdToEnd })
                });

                const data = await response.json();
                console.log('Session end response:', data);
            } catch (err) {
                console.error('Failed to end session:', err);
            } finally {
                toggleSessionState(false);
                stopTimer();
                clearQR();
                currentSessionId = null;
            }
        }

        // State & UI Toggle
        function toggleSessionState(isLive) {
            document.getElementById('btn-start').style.display = isLive ? 'none' : 'block';
            document.getElementById('btn-end').style.display = isLive ? 'block' : 'none';
            document.getElementById('subject').disabled = isLive;
            document.getElementById('class-id').disabled = isLive;
            document.getElementById('timer-box').style.visibility = isLive ? 'visible' : 'hidden';
        }

        // QR rendering
        function renderQRCode(value) {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = '';
            qrContainer.classList.remove('qr-placeholder');

            qrcodeObj = new QRCode(qrContainer, {
                text: value,
                width: 248,
                height: 248,
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function clearQR() {
            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = 'Start a session to generate dynamic QR code';
            qrContainer.classList.add('qr-placeholder');
            qrcodeObj = null;
        }

        // Timer
        function startTimer() {
            stopTimer();
            countdown = 15;
            updateCountdown();

            timerInterval = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    countdown = 15;
                }
                updateCountdown();
            }, 1000);
        }

        function resetCountdown() {
            countdown = 15;
            updateCountdown();
        }

        function updateCountdown() {
            document.getElementById('timer-count').innerText = countdown;
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Live attendance list
        function addStudentToList(studentName, pointsDelta) {
            const list = document.getElementById('attendance-list');
            const empty = document.getElementById('attendance-empty');

            if (empty) empty.style.display = 'none';

            const item = document.createElement('div');
            item.className = 'student-item';

            const deltaText = Number(pointsDelta) > 0
                ? `+${pointsDelta}`
                : `${pointsDelta ?? 0}`;

            item.innerHTML = `
                <span class="student-name">${escapeHtml(studentName)}</span>
                <span class="credibility-score">${escapeHtml(deltaText)} pts</span>
            `;

            list.prepend(item);
            presentCount++;
            document.getElementById('total-count').innerText = presentCount;
        }

        // Threat alerts
        function addThreatAlert(studentName, reason) {
            const list = document.getElementById('threats-list');
            const empty = document.getElementById('threats-empty');

            if (empty) empty.style.display = 'none';

            const item = document.createElement('div');
            item.className = 'threat-item';
            item.innerHTML = `
                <div class="threat-title">${escapeHtml(studentName)}</div>
                <div class="threat-desc">${escapeHtml(reason)}</div>
            `;

            list.prepend(item);
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }
    </script>
</body>
</html>
